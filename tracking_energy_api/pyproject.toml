[project]
name = "tracking-energy-api"
version = "0.0.1"
requires-python = ">=3.11,<3.12"
dependencies = [
  "asgiref>=3.6,<4",
  "click>=8.1.3,<9",
  "colorama>=0.4.6,<1",
  "dnspython>=2.6.1,<3",
  "Flask[async]>=3.1.3,<4",
  "Flask-Cors>=6.0.5,<7",
  "Flask-PyMongo>=3,<4",
  "itsdangerous>=2.2,<3",
  "Jinja2>=3.1.6,<4",
  "MarkupSafe>=2.1.2,<4",
  "numpy==1.24.2",
  "pymongo>=4.18.2,<5",
  "python-decouple==3.8",
  "six>=1.16,<2",
  "Werkzeug>=3.1.9,<4",
]

[dependency-groups]
dev = ["pytest>=8.4.2,<10"]

[tool.uv]
constraint-dependencies = ["certifi>=2026.10.19"]
